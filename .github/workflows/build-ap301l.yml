name: Build OpenWrt for HOS AP301L (IPQ5018)

on:
  workflow_dispatch:
  push:
    branches:
      - c3po-tag-8021q
    paths:
      - '.github/workflows/build-ap301l.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --force || true
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile || true
          sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gettext git libfuse-dev libncurses-dev \
            libpython3-dev libssl-dev llvm rsync unzip zlib1g-dev \
            file wget gawk libelf-dev ecj java-common

      - name: Add AP301L device tree
        run: |
          echo "" | base64 -d > target/linux/qualcommax/dts/ipq5018-ap301l.dts
          wc -l target/linux/qualcommax/dts/ipq5018-ap301l.dts

      - name: Add AP301L image recipe
        run: |
          echo "" | base64 -d >> target/linux/qualcommax/image/ipq50xx.mk
          tail -25 target/linux/qualcommax/image/ipq50xx.mk

      - name: Patch network defaults (02_network)
        run: |
          F=target/linux/qualcommax/ipq50xx/base-files/etc/board.d/02_network
          python3 - "$F" <<'PYEOF'
          import sys
          p = sys.argv[1]
          t = open(p).read()
          if 'hos,ap301l' not in t:
              anchor = '\tyuncore,ax830|\\'
              case = '\thos,ap301l)\n\t\tucidef_set_interface_lan "lan"\n\t\t;;\n'
              assert anchor in t, 'anchor not found in 02_network'
              t = t.replace(anchor, case + anchor, 1)
              open(p, 'w').write(t)
          print('02_network patched, hos_ap301l present:', 'hos,ap301l' in t)
          PYEOF
          grep -n -A2 'hos,ap301l' $F

      - name: Add VNT package
        run: |
          git clone --depth 1 https://github.com/kaka111222333/VNT_OpenWrt-Luci- package/vnt
          ls package/vnt

      - name: Add extra feeds (SSR-Plus)
        run: |
          grep -q helloworld feeds.conf.default || \
            echo 'src-git helloworld https://github.com/fw876/helloworld' >> feeds.conf.default
          cat feeds.conf.default

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure target
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_qualcommax=y' \
            'CONFIG_TARGET_qualcommax_ipq50xx=y' \
            'CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_hos_ap301l=y' \
            'CONFIG_PACKAGE_kmod-tun=y' \
            'CONFIG_PACKAGE_luci-app-ssr-plus=y' \
            'CONFIG_PACKAGE_luci-app-vnt=y' \
            'CONFIG_PACKAGE_vnt=y' > .config
          make defconfig
          grep -E 'hos_ap301l|luci-app-ssr-plus|luci-app-vnt|^CONFIG_PACKAGE_vnt=' .config

      - name: Build
        run: |
          make -j$(nproc) || make -j1 V=s

      - name: Collect images
        run: |
          mkdir -p out
          find bin/targets -type f \( -name '*factory*' -o -name '*sysupgrade*' -o -name '*.manifest' -o -name 'config.buildinfo' -o -name 'sha256sums' \) -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ap301l-openwrt-images
          path: out/
          retention-days: 30
